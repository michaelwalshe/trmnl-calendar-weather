---
# Local dev-server config for `trmnlp serve`. Not uploaded to TRMNL.
#
# The `variables` block stands in for the Plugin Merge payload: three nodes named
# the way TRMNL names them, <plugin_keyname>_<plugin_setting_id>. The shapes here
# mirror real payloads - calendar events carry background_color and location,
# today_in_tz is a full timestamp with an offset, weather icons are absolute URLs
# (Tempest), and the hourly node nests its values under `data`.
#
# Sample events are invented. Do not paste real calendar data into this file:
# the repository is public.
#
# Everything is anchored to today_in_tz, which the template treats as day one of
# the rolling week, so this renders a full week whatever the real date is.

watch:
  - src
  - .trmnlp.yml

time_zone: Europe/London

custom_fields:
  days: "7"
  week_start: "rolling"
  hour_from: ""
  hour_to: ""
  now_line: "yes"
  screen_height: "600"

variables:
  trmnl:
    user:
      name: Sample User
      utc_offset: 0          # accounts with no time zone set report 0
    system:
      # Pinned so previews are reproducible - without it the render (and the
      # committed PNGs) drift with the wall clock.
      timestamp_utc: 1787564400   # 2026-08-24 09:40 UTC = 10:40 +01:00
    plugin_settings:
      instance_name: Week and Weather

  google_calendar_12345:
    tz: Europe/London
    today_in_tz: "2026-08-24T00:00:00.000+01:00"
    event_layout: rolling_week
    first_day: 1
    time_format: "am/pm"
    date_format: short
    scroll_time: "09:00:00"
    scroll_time_end: "21:00:00"
    include_description: false
    include_event_time: true
    shade_weekends: true
    colorize_events: true
    highlight_today: true
