  # Native Weather plugin, Tempest provider: absolute icon URLs, no top-level
  # "conditions" key - the template falls back to right_now_conditions.
  weather_67890:
    temperature: 15
    feels_like: 15
    humidity: 65
    utc_offset: 0
    time_format: "%H:%M"
    data_provider: tempest
    today_conditions: "Partly Cloudy"
    right_now_conditions: "Partly Cloudy"
    weather_image: "https://tempestwx.com/images/Updated/partly-cloudy-night.svg"
    today_weather_image: "https://tempestwx.com/images/Updated/partly-cloudy-day.svg"
    tomorrow_weather_image: "https://tempestwx.com/images/Updated/possibly-thunderstorm-day.svg"
    forecast:
      right_now:
        icon: partly-cloudy-night
        conditions: "Partly Cloudy"
        temperature: 15
        feels_like: 15
        humidity: 65
        sunrise: "05:06"
        sunset: "19:07"
        wind:
          max: 6
          gust: 12.0
          units: mph
          direction_cardinal: ENE
      today:
        icon: partly-cloudy-day
        conditions: "Partly Cloudy"
        maxtemp: 25.0
        mintemp: 14.0
        uv_index: 0
        day_override: null
        precip:
          icon: chance-rain
          units: mm
          amount: null
          probability: 10
      tomorrow:
        icon: possibly-thunderstorm-day
        conditions: "Thunderstorms Possible"
        maxtemp: 26.0
        mintemp: 16.0
        uv_index: 3
        day_override: null
        precip:
          icon: chance-rain
          probability: 30

  # Weather Glance recipe: values live under `data`, temperatures are arrays.
  weather_glance_67891:
