---
# Local dev-server config for `trmnlp serve`. Not uploaded to TRMNL.
#
# The `variables` block below stands in for the Plugin Merge payload: two nodes
# named the way TRMNL names them, <plugin_keyname>_<plugin_setting_id>. Rename
# them here and in src/full.liquid to match your own plugin instances.
#
# Dates are anchored to today_in_tz, which the template uses as day one of the
# rolling week, so this sample renders a full week whatever the real date is.

watch:
  - src
  - .trmnlp.yml

time_zone: Europe/London

custom_fields:
  days: "7"
  week_start: "rolling"
  hour_from: ""
  hour_to: ""

variables:
  trmnl:
    user:
      name: Sample User
      utc_offset: 3600
    plugin_settings:
      instance_name: Week + Weather

