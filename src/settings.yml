---
strategy: plugin_merge
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.2.0
serverless_language: ''
polling_url: ''
polling_headers: ''
polling_body: ''
id: 455834
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: calendar_source
  field_type: plugin_instance_select
  name: Calendar
  plugin_keyname: google_calendar
  description: Which calendar instance to read events from
  help_text: Only plugins currently on a playlist or mashup appear here. Hidden is fine.
- keyname: weather_source
  field_type: plugin_instance_select
  name: Weather
  plugin_keyname: weather
  description: Which weather instance to read conditions from
  help_text: Works with the native Weather plugin on any provider.
- keyname: hourly_source
  field_type: plugin_instance_select
  name: Hourly weather
  plugin_keyname: private_plugin
  optional: true
  description: Weather Glance instance, drawn as icons over a sunlight curve
  help_text: Leave empty to drop the hourly panel from the weather strip.
- keyname: days
  field_type: select
  name: Days shown
  description: Number of day columns
  default: '7'
  options:
  - '7'
  - '5'
  - '4'
  - '3'
- keyname: week_start
  field_type: select
  name: First column
  description: Roll forward from today, or pin to the start of the week
  default: rolling
  options:
  - rolling
  - week
- keyname: now_line
  field_type: select
  name: Now line
  description: Draw a rule across today's column at the current time
  default: 'yes'
  options:
  - 'yes'
  - 'no'
- keyname: hour_from
  field_type: number
  name: First hour
  optional: true
  min: 0
  max: 23
  placeholder: auto
  description: Leave blank to follow the calendar plugin's own scroll time
- keyname: hour_to
  field_type: number
  name: Last hour
  optional: true
  min: 1
  max: 24
  placeholder: auto
  description: Leave blank to follow the calendar plugin's own scroll time
- keyname: screen_height
  field_type: number
  name: Screen height
  optional: true
  min: 240
  max: 2000
  placeholder: '600'
  description: Panel height in pixels; blank uses the device value, else 600
name: Week and Weather
description: A glance calendar and weather in 1
refresh_interval: 15
