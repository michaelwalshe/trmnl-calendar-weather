name: TRMNL

# Lints on every PR and push; uploads src/* to the private plugin from main.
# Mirrors the workflow `trmnlp init` scaffolds, with one addition: `trmnlp push`
# creates a NEW plugin when it cannot find an id, so an unguarded run would make
# a fresh duplicate every time. The id is resolved from the TRMNL_PLUGIN_ID repo
# variable or from src/settings.yml, and with neither the run stops rather than
# guessing. After a create, the settings.yml the server returns is committed
# back so later runs update in place.
#
# This repo is also connected to TRMNL's GitHub Sync app, which commits the
# server's settings.yml here whenever the plugin is saved in the TRMNL UI. That
# direction is automatic; GitHub -> TRMNL is not (Sync only offers an import
# button), which is what this workflow automates. The push job skips the Sync
# app's own commits so the two cannot chase each other.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_create:
        description: 'Create a new plugin if no id is known (first push only)'
        type: boolean
        default: false

concurrency:
  group: trmnl-push
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'   # the gem requires >= 3.4
          bundler-cache: false
      - run: gem install trmnl_preview
      - run: trmnlp lint

  push:
    needs: lint
    # Skip commits the TRMNL Sync app made. It writes src/settings.yml back to
    # this repo whenever the plugin changes on the server, so without this a
    # push from here would trigger a sync commit, which would trigger another
    # push, and so on.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.author.name != 'trmnl-sync[bot]' &&
      !contains(github.event.head_commit.message, 'Updated from TRMNL')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to commit the plugin id back after a create

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - run: gem install trmnl_preview

      - name: Work out which plugin to update
        id: target
        env:
          VAR_ID: ${{ vars.TRMNL_PLUGIN_ID }}
        run: |
          id="$VAR_ID"
          if [ -z "$id" ]; then
            id=$(sed -n "s/^id:[[:space:]]*//p" src/settings.yml | tr -d "\"'" | head -1)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if [ -n "$id" ]; then
            echo "Updating plugin $id"
          else
            echo "No plugin id known yet"
          fi

      - name: Refuse to create a duplicate plugin
        if: steps.target.outputs.id == '' && github.event.inputs.allow_create != 'true'
        run: |
          echo "::error::No plugin id found. Set the TRMNL_PLUGIN_ID repo variable, or"
          echo "::error::run this workflow manually with 'allow_create' ticked to make the"
          echo "::error::plugin once. Pushing blind would create a second copy every run."
          exit 1

      - name: Upload
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
          PLUGIN_ID: ${{ steps.target.outputs.id }}
        run: |
          if [ -z "$TRMNL_API_KEY" ]; then
            echo "::error::Secret TRMNL_API_KEY is empty or not set for this repository."
            exit 1
          fi
          # --force skips the overwrite prompt, which has no stdin on a runner
          if [ -n "$PLUGIN_ID" ]; then
            trmnlp push --force --id "$PLUGIN_ID"
          else
            trmnlp push --force
          fi

      - name: Persist the plugin id
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- src/settings.yml; then
            echo "settings.yml unchanged, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settings.yml
          # [skip ci] matters: this commit touches src/ and would otherwise
          # retrigger the workflow that made it
          git commit -m "Persist TRMNL plugin id from push [skip ci]"
          # the TRMNL Sync app writes this file too, so lose the race politely -
          # the id is already committed, nothing is lost by skipping
          git pull --rebase --autostash origin "$BRANCH" || true
          git push origin "HEAD:refs/heads/$BRANCH" ||             echo "::warning::Could not push settings.yml back (likely a TRMNL Sync race). Nothing lost."

